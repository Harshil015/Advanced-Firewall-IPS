# Advanced Firewall Configuration File

# Ports to use as Honeypots (comma separated)
HONEYPORTS="2222,8080,9999"

# Ports to protect with rate limiting (comma separated)
PROTECTED_PORTS="22,80,443"

# Max connections per minute before banning
MAX_CONN=5

# GeoIP Blocking (Requires xtables-addons). Leave empty to disable.
# Example: Block China and Russia
GEOIP_BLOCK="CN,RU"

# Slack/Discord Webhook URL (Leave empty to disable alerts)
WEBHOOK_URL="https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

# Persistence file (Saves banned IPs to survive reboots)
BANLIST_FILE="/etc/firewall-ips/banned_ips.txt"
